name: Determinism Check

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism:
    name: Determinism Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify governed deterministic surface
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ci/check_determinism.sh
          ci/check_determinism.sh
